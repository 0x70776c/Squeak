<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520">
  <title>Generic Mouse</title>
  <!-- Mouse Body Shell -->
  <path id="body-shell"
        d="M 160 36 C 220 36, 256 76, 258 156 L 258 340 C 258 432, 218 484, 160 484 C 102 484, 62 432, 62 340 L 62 156 C 64 76, 100 36, 160 36 Z"
        fill="#242933" stroke="#5c667a" stroke-width="3" />

  <!-- Left Click -->
  <path id="btn-left" class="squeak-btn"
        d="M 80 70 C 100 48, 128 42, 152 42 L 152 204 L 70 204 C 68 144, 70 94, 80 70 Z"
        fill="#2f3644" stroke="#6d788f" stroke-width="2" />

  <!-- Right Click -->
  <path id="btn-right" class="squeak-btn"
        d="M 168 42 C 192 42, 220 48, 240 70 C 250 94, 252 144, 250 204 L 168 204 Z"
        fill="#2f3644" stroke="#6d788f" stroke-width="2" />

  <!-- Middle Click -->
  <rect id="btn-middle" class="squeak-btn" x="148" y="84" width="24" height="68" rx="8"
        fill="#444e63" stroke="#8c99b2" stroke-width="2" />

  <!-- Forward & Back Thumb Buttons -->
  <rect id="btn-forward" class="squeak-btn" x="54" y="186" width="14" height="46" rx="5"
        fill="#3a4354" stroke="#7d8aa3" stroke-width="1.8" />
  <rect id="btn-back" class="squeak-btn" x="54" y="242" width="14" height="46" rx="5"
        fill="#3a4354" stroke="#7d8aa3" stroke-width="1.8" />
</svg>
