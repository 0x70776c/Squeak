# Device presentation & button layout for G502 HERO (also covers G502 SE HERO, same PID).
# M2 hardware-verified on physical unit (Fedora/Linux):
# - USB VID:PID: 046d:c08b (`lsusb`: "Logitech, Inc. G502 SE HERO Gaming Mouse")
# - HID_NAME: "Logitech G502 HERO Gaming Mouse"
# - HID++ 4.2, reports 0x10/0x11, 20 features:
#   IFeatureSet (0x0001 v1), FIRMWARE_INFO (0x0003 v2), DEVICE_NAME (0x0005 v0),
#   ADJUSTABLE_DPI (0x2201 v1), REPORT_RATE (0x8060 v0), COLOR_LED_EFFECTS (0x8070 v3),
#   ONBOARD_PROFILES (0x8100 v0), MOUSE_BUTTON_SPY (0x8110 v0).
# - Note: REPROG_CONTROLS_V4 (0x1B04) is absent; button remaps go through 0x8100/0x8110.
# - [NEEDS-HW]: Verify button CIDs below via MOUSE_BUTTON_SPY (0x8110) / ONBOARD_PROFILES (M5/M6).

name = "G502 HERO"
vendor_id = 0x046d
product_ids = [0xc08b]
kind = "mouse"
# svg = "g502-hero.svg" # Deferred until M7 GUI; falls back to generic mouse diagram

