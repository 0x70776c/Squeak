<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520">
  <title>G502 HERO</title>

  <!-- Cable & Strain Relief -->
  <g id="cable" fill="none" stroke="#e5e9f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="172" y1="14" x2="172" y2="54" />
    <line x1="182" y1="14" x2="182" y2="54" />
    <rect x="167" y="54" width="20" height="40" rx="2" fill="#101318" />
    <line x1="168" y1="62" x2="174" y2="62" />
    <line x1="180" y1="62" x2="186" y2="62" />
    <line x1="168" y1="70" x2="174" y2="70" />
    <line x1="180" y1="70" x2="186" y2="70" />
    <line x1="168" y1="78" x2="174" y2="78" />
    <line x1="180" y1="78" x2="186" y2="78" />
    <line x1="168" y1="86" x2="174" y2="86" />
    <line x1="180" y1="86" x2="186" y2="86" />
  </g>

  <!-- Outer Mouse Silhouette -->
  <path id="body-shell"
        d="M 192 68
           C 226 82, 256 106, 266 146
           C 276 196, 280 258, 281 312
           C 282 378, 272 444, 224 486
           C 210 498, 198 504, 190 504
           C 184 504, 180 496, 176 496
           C 172 496, 168 504, 162 504
           C 122 496, 94 448, 76 400
           C 50 384, 33 360, 33 328
           C 33 296, 52 272, 60 248
           L 63 188
           L 76 130
           C 84 104, 114 94, 160 94
           L 160 88
           L 192 88 Z"
        fill="#11141a" stroke="#e5e9f0" stroke-width="2" stroke-linejoin="round" />

  <!-- Left Side Trim Strip & Thumb Wing Inner Seam -->
  <path id="thumb-wing"
        d="M 60 250
           C 62 280, 62 314, 66 340
           C 74 366, 102 384, 132 404
           C 158 422, 174 444, 175 496"
        fill="none" stroke="#9aa6bd" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Inner Palm Seam Lines (strictly inside body-shell) -->
  <path id="palm-seams"
        d="M 164 292 L 194 278
           M 194 278 L 266 296
           M 252 293 C 266 350, 268 416, 238 468
           M 82 316 C 102 362, 146 384, 184 410 C 188 438, 189 470, 189 503"
        fill="none" stroke="#9aa6bd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Left Click (Primary) -->
  <path id="btn-left" class="squeak-btn"
        d="M 96 106 C 116 98, 138 95, 159 95 L 163 288 L 93 312 C 83 250, 82 168, 96 106 Z"
        fill="#161a22" stroke="#e5e9f0" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Right Click (Secondary) -->
  <path id="btn-right" class="squeak-btn"
        d="M 192 70 C 224 84, 248 106, 258 144 C 266 190, 268 246, 266 294 L 194 276 L 192 94 Z"
        fill="#161a22" stroke="#e5e9f0" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Center Spine Housing -->
  <path d="M 160 94 L 192 94 L 194 276 L 163 290 Z"
        fill="#101318" stroke="#9aa6bd" stroke-width="1.5" stroke-linejoin="round" />

  <!-- G8 (DPI Up) flush along left edge of Left Click -->
  <path id="btn-g8" class="squeak-btn"
        d="M 76 130 L 90 124 L 87 170 L 68 178 Z"
        fill="#1d222c" stroke="#e5e9f0" stroke-width="1.6" stroke-linejoin="round" />

  <!-- G7 (DPI Down) below G8 -->
  <path id="btn-g7" class="squeak-btn"
        d="M 67 184 L 86 176 L 84 220 L 64 226 Z"
        fill="#1d222c" stroke="#e5e9f0" stroke-width="1.6" stroke-linejoin="round" />

  <!-- Scroll Wheel Housing -->
  <rect x="163" y="114" width="30" height="86" rx="9" fill="#0d1015" stroke="#9aa6bd" stroke-width="1.6" />
  <!-- Middle Click (Grooved Scroll Wheel) -->
  <rect id="btn-middle" class="squeak-btn" x="168" y="120" width="20" height="74" rx="6"
        fill="#1f2530" stroke="#e5e9f0" stroke-width="1.8" />
  <!-- Wheel Grooves -->
  <g stroke="#d8dee9" stroke-width="1.3" pointer-events="none">
    <rect x="171" y="128" width="14" height="5" rx="2" fill="none" />
    <rect x="171" y="138" width="14" height="5" rx="2" fill="none" />
    <rect x="171" y="148" width="14" height="5" rx="2" fill="none" />
    <rect x="171" y="158" width="14" height="5" rx="2" fill="none" />
    <rect x="171" y="168" width="14" height="5" rx="2" fill="none" />
    <rect x="171" y="178" width="14" height="5" rx="2" fill="none" />
  </g>

  <!-- Scroll Left/Right Tilt (compact strips hugging wheel housing) -->
  <rect id="btn-scroll-left" class="squeak-btn" x="157" y="138" width="6" height="38" rx="2"
        fill="#1a1f28" stroke="#9aa6bd" stroke-width="1.1" />
  <rect id="btn-scroll-right" class="squeak-btn" x="193" y="138" width="6" height="38" rx="2"
        fill="#1a1f28" stroke="#9aa6bd" stroke-width="1.1" />

  <!-- Scroll Mode Latch (Decorative) -->
  <rect x="167" y="210" width="22" height="22" rx="3" fill="#181d26" stroke="#e5e9f0" stroke-width="1.5" />

  <!-- G9 (Profile Cycle) behind Scroll Wheel -->
  <path id="btn-g9" class="squeak-btn"
        d="M 167 240 L 189 240 L 190 270 L 168 276 Z"
        fill="#1d222c" stroke="#e5e9f0" stroke-width="1.6" stroke-linejoin="round" />

  <!-- Thumb Cluster: Forward (G5), Back (G4), Sniper (DPI Shift) -->
  <path id="btn-forward" class="squeak-btn"
        d="M 61 232 L 73 228 L 76 266 L 63 270 Z"
        fill="#1d222c" stroke="#e5e9f0" stroke-width="1.6" stroke-linejoin="round" />
  <path id="btn-back" class="squeak-btn"
        d="M 63 274 L 76 270 L 79 310 L 65 314 Z"
        fill="#1d222c" stroke="#e5e9f0" stroke-width="1.6" stroke-linejoin="round" />
  <path id="btn-dpi-shift" class="squeak-btn"
        d="M 41 280 L 55 276 L 57 320 L 40 318 Z"
        fill="#222834" stroke="#e5e9f0" stroke-width="1.6" stroke-linejoin="round" />

  <!-- Decorative DPI LEDs (3 diagonal bars) -->
  <g id="led-dpi" fill="#3584e4" stroke="#9aa6bd" stroke-width="0.6">
    <rect x="78" y="254" width="10" height="3.8" rx="1.4" transform="rotate(-18 83 256)" />
    <rect x="80" y="272" width="10" height="3.8" rx="1.4" transform="rotate(-18 85 274)" />
    <rect x="82" y="290" width="10" height="3.8" rx="1.4" transform="rotate(-18 87 292)" />
  </g>

  <!-- Neutral Logo LED Zone -->
  <circle id="led-logo" cx="152" cy="348" r="16" fill="none" stroke="#3584e4" stroke-width="3" />
</svg>
