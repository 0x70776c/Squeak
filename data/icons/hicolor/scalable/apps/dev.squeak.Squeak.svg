<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Squeak</title>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#262a2f" />
  <!-- Cable & Mouse Body Silhouette (Squeak Logo) -->
  <g fill="none" stroke="#b8441e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top cable curve -->
    <path d="M 64 38 L 64 26 C 64 16, 80 16, 84 24 C 87 30, 94 28, 96 22" />
    <!-- Mouse upper shell -->
    <path d="M 44 64 L 44 52 C 44 38, 84 38, 84 52 L 84 58" />
    <path d="M 64 38 L 64 64" />
    <!-- Tail loop into mouse-rat silhouette -->
    <path d="M 44 96 C 24 94, 22 62, 44 62 C 56 62, 62 66, 72 64" />
    <!-- Rat ear & head outline -->
    <path d="M 74 62 C 72 52, 82 50, 86 58 C 92 60, 98 66, 102 72 C 96 76, 88 76, 84 74" />
  </g>
  <!-- Scroll wheel accent -->
  <rect x="60" y="46" width="8" height="14" rx="4" fill="#ff6319" />
  <!-- Eye -->
  <circle cx="88" cy="65" r="2.2" fill="#b8441e" />
  <!-- Circuit trace accent -->
  <g fill="none" stroke="#26b6e0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 64 98 L 64 82" />
    <path d="M 72 98 L 72 86 L 80 78 L 80 74" />
  </g>
  <circle cx="64" cy="79" r="3.5" fill="#26b6e0" />
  <circle cx="80" cy="71" r="3.5" fill="#26b6e0" />
</svg>
