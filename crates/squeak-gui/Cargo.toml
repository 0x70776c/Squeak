[package]
name = "squeak-gui"
description = "GTK4 / libadwaita desktop control panel for Squeak (communicates via D-Bus only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["adw_v1_4"]
adw_v1_4 = ["libadwaita/v1_4"]

[dependencies]
futures-lite.workspace = true
gtk4 = { version = "0.10", features = ["v4_6"] }
libadwaita = { version = "0.8", features = ["v1_1"] }
serde.workspace = true
serde_json.workspace = true
squeak-core.workspace = true
tokio.workspace = true
zbus.workspace = true

[lints]
workspace = true
